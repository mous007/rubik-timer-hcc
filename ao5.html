<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Timer HCC - Chế Độ Ao5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        /* Khóa màn hình cố định 100vh, tuyệt đối không cuộn trang */
        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 12px 20px;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Scramble Box */
        .scramble-box {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #f1f5f9;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 800px;
            width: 100%;
            flex-shrink: 0;
        }

        /* Timer Display */
        .timer-display {
            font-size: 4.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            margin: 2px 0;
            color: #ffffff;
            cursor: pointer;
            line-height: 1;
            flex-shrink: 0;
            transition: color 0.1s ease;
        }

        .timer-display.holding { color: #f59e0b; }
        .timer-display.ready { color: #22c55e; }
        .timer-display.running { color: #ef4444; }

        .hint {
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 12px;
            text-align: center;
            flex-shrink: 0;
        }

        /* Thanh trạng thái lượt giải & Nhập kết quả (Thay thế cho card 'Lượt gần đây') */
        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .solves-inline {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .solve-pill {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            min-width: 60px;
            text-align: center;
        }

        .solve-pill.best { border-color: #22c55e; color: #4ade80; font-weight: bold; }
        .solve-pill.worst { border-color: #ef4444; color: #f87171; font-weight: bold; }

        .ao5-summary {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--accent-color);
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px dashed var(--accent-color);
        }

        .actions-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="text"] {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 0.85rem;
            outline: none;
            width: 140px;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.96); }

        .btn-reset {
            background: #ef4444;
            color: white;
        }
        .btn-reset:hover { background: #dc2626; }

        /* Bảng Xếp Hạng - Chiếm toàn bộ phần chiều cao còn lại */
        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 900px;
            flex: 1;
            min-height: 0; /* Cho phép co giãn trong flex container */
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .leaderboard-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--accent-color);
        }

        .badge {
            background: #334155;
            color: #cbd5e1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 6px;
        }

        /* Tùy chỉnh thanh cuộn bên trong bảng */
        .table-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.88rem;
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .rank-1 { color: var(--gold); font-weight: bold; }
        .rank-2 { color: var(--silver); font-weight: bold; }
        .rank-3 { color: var(--bronze); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Rubik Timer HCC</h1>
    </header>

    <div class="scramble-box" id="scramble">Đang khởi tạo scramble...</div>

    <div class="timer-display" id="timer">0.00</div>
    <div class="hint">Nhấn giữ phím <b>SPACE</b> đến khi đổi sang màu xanh để chuẩn bị</div>

    <!-- Thanh trạng thái lượt giải & Nhập kết quả -->
    <div class="status-bar">
        <div class="solves-inline">
            <div class="solve-pill" id="p1">1: --</div>
            <div class="solve-pill" id="p2">2: --</div>
            <div class="solve-pill" id="p3">3: --</div>
            <div class="solve-pill" id="p4">4: --</div>
            <div class="solve-pill" id="p5">5: --</div>
        </div>

        <div class="ao5-summary">
            Ao5: <span id="ao5-val">--</span>
        </div>

        <div class="actions-group">
            <input type="text" id="player-name" placeholder="Tên thí sinh...">
            <button class="btn" onclick="saveToLeaderboard()">Lưu BXH</button>
            <button class="btn btn-reset" onclick="resetSession()">Reset</button>
        </div>
    </div>

    <!-- Bảng Xếp Hạng Cố Định Của Màn Hình -->
    <div class="leaderboard-card">
        <div class="leaderboard-header">
            <h2>BẢNG XẾP HẠNG GIẢI ĐUA</h2>
            <span class="badge" id="total-participants">0 Thí sinh</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Hạng</th>
                        <th>Thí sinh</th>
                        <th>Lần 1</th>
                        <th>Lần 2</th>
                        <th>Lần 3</th>
                        <th>Lần 4</th>
                        <th>Lần 5</th>
                        <th>Tốt nhất</th>
                        <th>Ao5</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Javascript sẽ đổ dữ liệu vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu Bảng xếp hạng
        let leaderboard = [
            { name: "Nguyễn Văn A", solves: [9.50, 10.20, 8.90, 11.00, 9.80], best: 8.90, ao5: 9.83 },
            { name: "Trần Thị B", solves: [10.10, 12.00, 9.50, 10.50, 10.00], best: 9.50, ao5: 10.20 },
            { name: "Lê Hoàng C", solves: [11.20, 10.80, 10.50, 12.10, 10.90], best: 10.50, ao5: 10.97 },
            { name: "Phạm D", solves: [12.50, 11.90, 11.50, 13.00, 11.80], best: 11.50, ao5: 12.07 }
        ];

        let currentSolves = [];
        let timerState = 'stopped'; // stopped, holding, ready, running
        let holdTimeout = null;
        let startTime = 0;
        let timerInterval = null;

        const moves = ["R", "L", "U", "D", "F", "B"];
        const modifiers = ["", "'", "2"];

        function generateScramble() {
            let scramble = [];
            let lastMove = "";
            for (let i = 0; i < 20; i++) {
                let move;
                do {
                    move = moves[Math.floor(Math.random() * moves.length)];
                } while (move === lastMove);
                lastMove = move;
                let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(move + mod);
            }
            document.getElementById('scramble').innerText = scramble.join(" ");
        }

        function calculateAo5(times) {
            if (times.length < 5) return null;
            let sorted = [...times].sort((a, b) => a - b);
            // Loại bỏ lượt tốt nhất và tệ nhất
            let middle3 = sorted.slice(1, 4);
            let avg = middle3.reduce((sum, val) => sum + val, 0) / 3;
            return Math.round(avg * 100) / 100;
        }

        function updateSessionUI() {
            for (let i = 1; i <= 5; i++) {
                let pill = document.getElementById(`p${i}`);
                pill.classList.remove('best', 'worst');

                if (currentSolves[i - 1] !== undefined) {
                    pill.innerText = `${i}: ${currentSolves[i - 1].toFixed(2)}s`;
                } else {
                    pill.innerText = `${i}: --`;
                }
            }

            if (currentSolves.length === 5) {
                let sorted = [...currentSolves].map((val, idx) => ({ val, idx })).sort((a, b) => a.val - b.val);
                let minIdx = sorted[0].idx;
                let maxIdx = sorted[4].idx;

                document.getElementById(`p${minIdx + 1}`).classList.add('best');
                document.getElementById(`p${maxIdx + 1}`).classList.add('worst');

                let ao5 = calculateAo5(currentSolves);
                document.getElementById('ao5-val').innerText = ao5.toFixed(2) + "s";
            } else {
                document.getElementById('ao5-val').innerText = "--";
            }
        }

        function renderLeaderboard() {
            leaderboard.sort((a, b) => a.ao5 - b.ao5);
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            leaderboard.forEach((entry, index) => {
                const tr = document.createElement('tr');
                let rankClass = '';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';

                tr.innerHTML = `
                    <td class="${rankClass}">${index + 1}</td>
                    <td style="font-weight: 600;">${entry.name}</td>
                    <td>${entry.solves[0].toFixed(2)}</td>
                    <td>${entry.solves[1].toFixed(2)}</td>
                    <td>${entry.solves[2].toFixed(2)}</td>
                    <td>${entry.solves[3].toFixed(2)}</td>
                    <td>${entry.solves[4].toFixed(2)}</td>
                    <td style="color: #22c55e;">${entry.best.toFixed(2)}</td>
                    <td style="font-weight: bold; color: var(--accent-color);">${entry.ao5.toFixed(2)}s</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-participants').innerText = `${leaderboard.length} Thí sinh`;
        }

        function saveToLeaderboard() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim();

            if (!name) {
                alert("Vui lòng nhập tên thí sinh!");
                return;
            }

            if (currentSolves.length < 5) {
                alert("Bạn cần hoàn thành đủ 5 lượt giải Ao5 để lưu vào Bảng Xếp Hạng!");
                return;
            }

            let ao5 = calculateAo5(currentSolves);
            let best = Math.min(...currentSolves);

            leaderboard.push({
                name: name,
                solves: [...currentSolves],
                best: best,
                ao5: ao5
            });

            renderLeaderboard();
            nameInput.value = '';
            resetSession();
            alert(`Đã lưu thành tích Ao5 (${ao5.toFixed(2)}s) của ${name} vào Bảng Xếp Hạng!`);
        }

        function resetSession() {
            currentSolves = [];
            updateSessionUI();
            document.getElementById('timer').innerText = "0.00";
            generateScramble();
        }

        // Đếm giờ
        const timerEl = document.getElementById('timer');

        function startTimer() {
            startTime = Date.now();
            timerState = 'running';
            timerEl.className = 'timer-display running';
            timerInterval = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                timerEl.innerText = elapsed.toFixed(2);
            }, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            let elapsed = (Date.now() - startTime) / 1000;
            timerEl.innerText = elapsed.toFixed(2);
            timerState = 'stopped';
            timerEl.className = 'timer-display';

            if (currentSolves.length < 5) {
                currentSolves.push(elapsed);
                updateSessionUI();
                generateScramble();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (timerState === 'running') {
                    stopTimer();
                } else if (timerState === 'stopped' && currentSolves.length < 5) {
                    timerState = 'holding';
                    timerEl.className = 'timer-display holding';
                    holdTimeout = setTimeout(() => {
                        timerState = 'ready';
                        timerEl.className = 'timer-display ready';
                    }, 300);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (timerState === 'holding') {
                    clearTimeout(holdTimeout);
                    timerState = 'stopped';
                    timerEl.className = 'timer-display';
                } else if (timerState === 'ready') {
                    startTimer();
                }
            }
        });

        // Khởi tạo ban đầu
        generateScramble();
        renderLeaderboard();
    </script>
</body>
</html>
