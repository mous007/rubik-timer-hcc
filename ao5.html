<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Timer HCC - Chế Độ Ao5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --border-color: #334155;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 12px 20px;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-nav-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-badge {
            background: #0f172a;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-btn {
            background: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            border: 1px solid var(--border-color);
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        .scramble-box {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #f1f5f9;
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 900px;
            width: 100%;
            flex-shrink: 0;
        }

        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
            flex-shrink: 0;
        }

        .timer-display {
            font-size: 4.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            line-height: 1;
            transition: color 0.1s ease;
        }

        .timer-display.inspection { color: var(--warning-color); }
        .timer-display.holding { color: var(--warning-color); }
        .timer-display.ready { color: var(--success-color); }
        .timer-display.running { color: var(--danger-color); }

        .hint {
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .penalty-bar {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-penalty {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #94a3b8;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-penalty.active {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .solves-inline {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .solve-pill {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            min-width: 65px;
            text-align: center;
        }

        .solve-pill.best { border-color: var(--success-color); color: #4ade80; font-weight: bold; }
        .solve-pill.worst { border-color: var(--danger-color); color: #f87171; font-weight: bold; }

        .ao5-summary {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--accent-color);
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px dashed var(--accent-color);
        }

        .actions-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        .btn-reset {
            background: var(--danger-color);
            color: white;
        }
        .btn-reset:hover { background: #dc2626; }

        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 900px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .leaderboard-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .leaderboard-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--accent-color);
        }

        .date-picker {
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }

        .badge {
            background: #334155;
            color: #cbd5e1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 6px;
        }

        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: #0f172a; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.88rem;
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .rank-1 { color: var(--gold); font-weight: bold; }
        .rank-2 { color: var(--silver); font-weight: bold; }
        .rank-3 { color: var(--bronze); font-weight: bold; }
        .empty-msg {
            color: #64748b;
            padding: 20px;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rubik Timer HCC</h1>
        <div class="user-nav-group">
            <span class="user-badge" id="user-display">Chưa đăng nhập</span>
            <a href="index.html" class="nav-btn">
                <span>&#128100;</span> Trang chủ / Tài khoản
            </a>
        </div>
    </header>

    <div class="scramble-box" id="scramble">Đang khởi tạo scramble...</div>

    <div class="timer-container">
        <div class="timer-display" id="timer">0.00</div>
        <div class="penalty-bar" id="penalty-bar" style="display: none;">
            <button class="btn-penalty" id="btn-plus2" onclick="togglePenalty('+2')">+2</button>
            <button class="btn-penalty" id="btn-dnf" onclick="togglePenalty('DNF')">DNF</button>
        </div>
    </div>
    <div class="hint" id="hint-msg">Nhấn <b>SPACE</b> để bắt đầu 15s quan sát | Nhấn giữ <b>SPACE</b> để chuẩn bị giải</div>

    <div class="status-bar">
        <div class="solves-inline">
            <div class="solve-pill" id="p1">1: --</div>
            <div class="solve-pill" id="p2">2: --</div>
            <div class="solve-pill" id="p3">3: --</div>
            <div class="solve-pill" id="p4">4: --</div>
            <div class="solve-pill" id="p5">5: --</div>
        </div>

        <div class="ao5-summary">
            Ao5: <span id="ao5-val">--</span>
        </div>

        <div class="actions-group">
            <button class="btn" id="btn-save" onclick="saveToLeaderboard()">Lưu BXH Hôm Nay</button>
            <button class="btn btn-reset" onclick="resetSession()">Reset</button>
        </div>
    </div>

    <div class="leaderboard-card">
        <div class="leaderboard-header">
            <div class="leaderboard-title-group">
                <h2>BẢNG XẾP HẠNG GIẢI ĐUA</h2>
                <input type="date" id="leaderboard-date" class="date-picker" onchange="renderLeaderboard()">
            </div>
            <span class="badge" id="total-participants">0 Thí sinh</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Hạng</th>
                        <th>Thí sinh</th>
                        <th>Lần 1</th>
                        <th>Lần 2</th>
                        <th>Lần 3</th>
                        <th>Lần 4</th>
                        <th>Lần 5</th>
                        <th>Tốt nhất</th>
                        <th>Ao5</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function getTodayString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Tự động nhận diện Session từ Supabase Auth của index.html
        function getLoggedInUser() {
            let user = localStorage.getItem('currentUser') || localStorage.getItem('username');
            if (user) return user;

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('-auth-token')) {
                    try {
                        const sessionData = JSON.parse(localStorage.getItem(key));
                        const u = sessionData?.user || sessionData?.currentSession?.user;
                        if (u) {
                            return u.user_metadata?.display_name || u.email?.split('@')[0] || "Player";
                        }
                    } catch (e) {}
                }
            }
            return null;
        }

        let currentUser = getLoggedInUser();
        let leaderboard = JSON.parse(localStorage.getItem('rubik_hcc_leaderboard_daily')) || [];
        
        let currentSolves = [];
        let timerState = 'idle';
        let inspectionInterval = null;
        let inspectionStart = 0;
        let currentSolvePenalty = 'OK'; // Lưu hình phạt tính từ thời điểm BẮT ĐẦU GIẢI
        let holdTimeout = null;
        let startTime = 0;
        let timerInterval = null;

        const moves = ["R", "L", "U", "D", "F", "B"];
        const modifiers = ["", "'", "2"];

        document.getElementById('leaderboard-date').value = getTodayString();
        
        function updateAccountDisplay() {
            currentUser = getLoggedInUser();
            const userDisplay = document.getElementById('user-display');
            const btnSave = document.getElementById('btn-save');

            if (currentUser) {
                userDisplay.innerText = `👤 ${currentUser}`;
                userDisplay.style.borderColor = "var(--accent-color)";
                userDisplay.style.color = "var(--accent-color)";
                
                const today = getTodayString();
                const alreadySubmitted = leaderboard.some(entry => entry.name === currentUser && entry.date === today);
                
                if (alreadySubmitted) {
                    btnSave.disabled = true;
                    btnSave.innerText = "Đã Thi Hôm Nay";
                    document.getElementById('hint-msg').innerText = "⚠️ Bạn đã hoàn thành lượt thi Ao5 hôm nay! Hãy quay lại vào ngày mai.";
                } else {
                    btnSave.disabled = false;
                    btnSave.innerText = "Lưu BXH Hôm Nay";
                }
            } else {
                userDisplay.innerText = "⚠️ Chưa Đăng Nhập";
                userDisplay.style.borderColor = "var(--danger-color)";
                userDisplay.style.color = "var(--danger-color)";
                btnSave.disabled = true;
                btnSave.innerText = "Vui Lòng Đăng Nhập";
                document.getElementById('hint-msg').innerText = "⚠️ Bạn cần đăng nhập tài khoản ở Trang chủ (index.html) để tham gia thi!";
            }
        }

        function generateScramble() {
            let scramble = [];
            let lastMove = "";
            for (let i = 0; i < 20; i++) {
                let move;
                do {
                    move = moves[Math.floor(Math.random() * moves.length)];
                } while (move === lastMove);
                lastMove = move;
                let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(move + mod);
            }
            document.getElementById('scramble').innerText = scramble.join(" ");
        }

        function formatSolve(solve) {
            if (!solve) return "--";
            if (solve.penalty === 'DNF') return "DNF";
            if (solve.penalty === '+2') return (solve.rawTime + 2).toFixed(2) + "+";
            return solve.rawTime.toFixed(2);
        }

        function getNumericValue(solve) {
            if (!solve || solve.penalty === 'DNF') return Infinity;
            if (solve.penalty === '+2') return solve.rawTime + 2;
            return solve.rawTime;
        }

        function calculateAo5(solves) {
            if (solves.length < 5) return null;
            let times = solves.map(s => getNumericValue(s));
            let dnfCount = times.filter(t => t === Infinity).length;
            if (dnfCount >= 2) return "DNF";

            let sorted = [...times].sort((a, b) => a - b);
            let middle3 = sorted.slice(1, 4);
            let sum = middle3.reduce((acc, val) => acc + val, 0);
            let avg = sum / 3;
            return Math.round(avg * 100) / 100;
        }

        function updateSessionUI() {
            for (let i = 1; i <= 5; i++) {
                let pill = document.getElementById(`p${i}`);
                pill.classList.remove('best', 'worst');

                let solve = currentSolves[i - 1];
                if (solve) {
                    pill.innerText = `${i}: ${formatSolve(solve)}`;
                } else {
                    pill.innerText = `${i}: --`;
                }
            }

            if (currentSolves.length === 5) {
                let numericTimes = currentSolves.map((s, idx) => ({ val: getNumericValue(s), idx }));
                numericTimes.sort((a, b) => a.val - b.val);
                
                let minIdx = numericTimes[0].idx;
                let maxIdx = numericTimes[4].idx;

                document.getElementById(`p${minIdx + 1}`).classList.add('best');
                document.getElementById(`p${maxIdx + 1}`).classList.add('worst');

                let ao5 = calculateAo5(currentSolves);
                document.getElementById('ao5-val').innerText = typeof ao5 === 'number' ? ao5.toFixed(2) + "s" : ao5;
            } else {
                document.getElementById('ao5-val').innerText = "--";
            }
        }

        function renderLeaderboard() {
            const selectedDate = document.getElementById('leaderboard-date').value;
            let dailyEntries = leaderboard.filter(entry => entry.date === selectedDate);

            dailyEntries.sort((a, b) => {
                if (a.ao5 === "DNF") return 1;
                if (b.ao5 === "DNF") return -1;
                return a.ao5 - b.ao5;
            });

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (dailyEntries.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-msg">Chưa có kết quả nào trong ngày ${selectedDate}.</td></tr>`;
                document.getElementById('total-participants').innerText = '0 Thí sinh';
                return;
            }

            dailyEntries.forEach((entry, index) => {
                const tr = document.createElement('tr');
                let rankClass = '';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';

                let ao5Str = typeof entry.ao5 === 'number' ? entry.ao5.toFixed(2) + "s" : "DNF";
                let bestStr = entry.best === Infinity ? "DNF" : entry.best.toFixed(2);

                tr.innerHTML = `
                    <td class="${rankClass}">${index + 1}</td>
                    <td style="font-weight: 600;">${entry.name}</td>
                    <td>${entry.solves[0]}</td>
                    <td>${entry.solves[1]}</td>
                    <td>${entry.solves[2]}</td>
                    <td>${entry.solves[3]}</td>
                    <td>${entry.solves[4]}</td>
                    <td style="color: #22c55e;">${bestStr}</td>
                    <td style="font-weight: bold; color: var(--accent-color);">${ao5Str}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-participants').innerText = `${dailyEntries.length} Thí sinh`;
        }

        function saveToLeaderboard() {
            if (!currentUser) {
                alert("Bạn cần đăng nhập tài khoản ở trang chính (index.html) trước khi thi!");
                return;
            }

            const today = getTodayString();
            const alreadySubmitted = leaderboard.some(entry => entry.name === currentUser && entry.date === today);

            if (alreadySubmitted) {
                alert("Mỗi tài khoản chỉ được tham gia thi Ao5 một lần duy nhất trong ngày!");
                return;
            }

            if (currentSolves.length < 5) {
                alert("Bạn cần hoàn thành đủ 5 lượt giải Ao5 để lưu vào Bảng Xếp Hạng!");
                return;
            }

            let ao5 = calculateAo5(currentSolves);
            let bestNumeric = Math.min(...currentSolves.map(s => getNumericValue(s)));
            let solveStrings = currentSolves.map(s => formatSolve(s));

            leaderboard.push({
                name: currentUser,
                date: today,
                solves: solveStrings,
                best: bestNumeric,
                ao5: ao5
            });

            localStorage.setItem('rubik_hcc_leaderboard_daily', JSON.stringify(leaderboard));
            
            document.getElementById('leaderboard-date').value = today;
            renderLeaderboard();
            updateAccountDisplay();
            resetSession();
            alert(`Đã lưu thành tích Ao5 (${typeof ao5 === 'number' ? ao5.toFixed(2) + 's' : ao5}) của tài khoản ${currentUser} cho ngày hôm nay!`);
        }

        function resetSession() {
            currentSolves = [];
            clearInterval(inspectionInterval);
            clearInterval(timerInterval);
            timerState = 'idle';
            inspectionStart = 0;
            currentSolvePenalty = 'OK';
            document.getElementById('timer').className = 'timer-display';
            document.getElementById('timer').innerText = "0.00";
            document.getElementById('penalty-bar').style.display = 'none';
            
            if (currentUser && !leaderboard.some(e => e.name === currentUser && e.date === getTodayString())) {
                document.getElementById('hint-msg').innerHTML = "Nhấn <b>SPACE</b> để bắt đầu 15s quan sát | Nhấn giữ <b>SPACE</b> để chuẩn bị giải";
            }
            updateSessionUI();
            generateScramble();
        }

        function togglePenalty(type) {
            if (currentSolves.length === 0) return;
            let lastIndex = currentSolves.length - 1;
            let solve = currentSolves[lastIndex];

            if (solve.penalty === type) {
                solve.penalty = 'OK';
            } else {
                solve.penalty = type;
            }

            document.getElementById('btn-plus2').classList.toggle('active', solve.penalty === '+2');
            document.getElementById('btn-dnf').classList.toggle('active', solve.penalty === 'DNF');

            document.getElementById('timer').innerText = formatSolve(solve);
            updateSessionUI();
        }

        function startInspection() {
            timerState = 'inspection';
            const timerEl = document.getElementById('timer');
            timerEl.className = 'timer-display inspection';
            timerEl.innerText = 15;

            inspectionStart = Date.now();
            inspectionInterval = setInterval(() => {
                let elapsed = (Date.now() - inspectionStart) / 1000;
                let remaining = Math.ceil(15 - elapsed);

                if (elapsed >= 17) {
                    timerEl.innerText = "DNF";
                    timerEl.className = "timer-display running";
                } else if (elapsed >= 15) {
                    timerEl.innerText = "+2";
                    timerEl.className = "timer-display holding";
                } else {
                    timerEl.innerText = remaining > 0 ? remaining : 1;
                }
            }, 50);
        }

        function startTimer() {
            // Chốt hình phạt theo đúng thời điểm BẮT ĐẦU GIẢI
            if (inspectionStart > 0) {
                let inspElapsed = (Date.now() - inspectionStart) / 1000;
                if (inspElapsed >= 17) {
                    currentSolvePenalty = 'DNF';
                } else if (inspElapsed >= 15) {
                    currentSolvePenalty = '+2';
                } else {
                    currentSolvePenalty = 'OK';
                }
            } else {
                currentSolvePenalty = 'OK';
            }

            clearInterval(inspectionInterval);
            startTime = Date.now();
            timerState = 'running';
            const timerEl = document.getElementById('timer');
            timerEl.className = 'timer-display running';
            document.getElementById('penalty-bar').style.display = 'none';

            timerInterval = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                timerEl.innerText = elapsed.toFixed(2);
            }, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            let elapsed = (Date.now() - startTime) / 1000;
            const timerEl = document.getElementById('timer');
            timerEl.className = 'timer-display';
            timerState = 'idle';

            let newSolve = {
                rawTime: elapsed,
                penalty: currentSolvePenalty // Sử dụng hình phạt đã chốt khi bấm bắt đầu giải
            };

            if (currentSolves.length < 5) {
                currentSolves.push(newSolve);
                timerEl.innerText = formatSolve(newSolve);
                
                document.getElementById('penalty-bar').style.display = 'flex';
                document.getElementById('btn-plus2').classList.toggle('active', currentSolvePenalty === '+2');
                document.getElementById('btn-dnf').classList.toggle('active', currentSolvePenalty === 'DNF');

                updateSessionUI();
                generateScramble();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (!currentUser) {
                    alert("Vui lòng đăng nhập ở trang chính (index.html) trước khi thi!");
                    return;
                }

                const today = getTodayString();
                if (leaderboard.some(entry => entry.name === currentUser && entry.date === today)) {
                    alert("Bạn đã hoàn thành lượt thi Ao5 của ngày hôm nay rồi!");
                    return;
                }

                if (timerState === 'running') {
                    stopTimer();
                } else if (timerState === 'idle' && currentSolves.length < 5) {
                    startInspection();
                } else if (timerState === 'inspection') {
                    timerState = 'holding';
                    document.getElementById('timer').className = 'timer-display holding';
                    holdTimeout = setTimeout(() => {
                        timerState = 'ready';
                        document.getElementById('timer').className = 'timer-display ready';
                    }, 300);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (timerState === 'holding') {
                    clearTimeout(holdTimeout);
                    timerState = 'inspection';
                    document.getElementById('timer').className = 'timer-display inspection';
                } else if (timerState === 'ready') {
                    startTimer();
                }
            }
        });

        // Khởi tạo
        updateAccountDisplay();
        generateScramble();
        renderLeaderboard();
    </script>
</body>
</html>
