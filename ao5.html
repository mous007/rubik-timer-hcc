<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Timer HCC - Chế Độ Ao5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --border-color: #334155;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 12px 20px;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-nav-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-badge {
            background: #0f172a;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-btn {
            background: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            border: 1px solid var(--border-color);
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        .scramble-box {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #f1f5f9;
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 900px;
            width: 100%;
            flex-shrink: 0;
        }

        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
            flex-shrink: 0;
        }

        .timer-display {
            font-size: 4.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            line-height: 1;
            transition: color 0.1s ease;
        }

        .timer-display.inspection { color: var(--warning-color); }
        .timer-display.holding { color: var(--warning-color); }
        .timer-display.ready { color: var(--success-color); }
        .timer-display.running { color: var(--danger-color); }

        .hint {
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .penalty-bar {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-penalty {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #94a3b8;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-penalty.active {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .solves-inline {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .solve-pill {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            min-width: 65px;
            text-align: center;
        }

        .solve-pill.best { border-color: var(--success-color); color: #4ade80; font-weight: bold; }
        .solve-pill.worst { border-color: var(--danger-color); color: #f87171; font-weight: bold; }

        .ao5-summary {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--accent-color);
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px dashed var(--accent-color);
        }

        .actions-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        .btn-reset {
            background: var(--danger-color);
            color: white;
        }
        .btn-reset:hover { background: #dc2626; }

        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 900px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .leaderboard-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .leaderboard-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--accent-color);
        }

        .date-picker {
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }

        .badge {
            background: #334155;
            color: #cbd5e1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 6px;
        }

        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: #0f172a; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.88rem;
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .rank-1 { color: var(--gold); font-weight: bold; }
        .rank-2 { color: var(--silver); font-weight: bold; }
        .rank-3 { color: var(--bronze); font-weight: bold; }
        .empty-msg {
            color: #64748b;
            padding: 20px;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

        <h1>Rubik Timer HCC</h1>
        <div class="user-nav-group">
            <span class="user-badge" id="user-display">Chưa đăng nhập</span>
            <a href="index.html" class="nav-btn">
                <span>&#128100;</span> Trang chủ / Tài khoản
            </a>
        </div>
    </header>

    <div class="scramble-box" id="scramble">Đang khởi tạo scramble...</div>

    <div class="timer-container">
        <div class="timer-display" id="timer">0.00</div>
        <div class="penalty-bar" id="penalty-bar" style="display: none;">
            <button class="btn-penalty" id="btn-plus2" onclick="togglePenalty('+2')">+2</button>
            <button class="btn-penalty" id="btn-dnf" onclick="togglePenalty('DNF')">DNF</button>
        </div>
    </div>
