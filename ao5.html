<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Timer HCC - Chế Độ Ao5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --border-color: #334155;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 12px 20px;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-nav-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-badge {
            background: #0f172a;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-btn {
            background: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            border: 1px solid var(--border-color);
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        /* KHU VỰC TRÊN CÙNG: SCRAMBLE */
        .scramble-box {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.3rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 2px;
            color: #f1f5f9;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 1400px;
            width: 100%;
            flex-shrink: 0;
        }

        /* BỐ CỤC CHÍNH 3 CỘT */
        .main-layout {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 1400px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            min-height: 0;
        }

        /* PANEL TRÁI: THÀNH TÍCH CÁ NHÂN */
        .left-panel {
            flex: 0 0 220px;
        }

        .panel-title {
            margin: 0 0 12px 0;
            font-size: 1.05rem;
            color: var(--accent-color);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .solves-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .solve-pill {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            color: #cbd5e1;
            text-align: center;
            transition: all 0.2s;
        }

        .solve-pill.best { border-color: var(--success-color); color: #4ade80; font-weight: bold; }
        .solve-pill.worst { border-color: var(--danger-color); color: #f87171; font-weight: bold; }

        .ao5-summary {
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            color: var(--accent-color);
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed var(--accent-color);
            margin-bottom: 16px;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        /* PANEL GIỮA: ĐẾM GIỜ */
        .center-panel {
            flex: 1;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .timer-display {
            font-size: 6rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            line-height: 1;
            transition: color 0.1s ease;
            margin-bottom: 20px;
        }

        .timer-display.inspection { color: var(--warning-color); }
        .timer-display.holding { color: var(--warning-color); }
        .timer-display.ready { color: var(--success-color); }
        .timer-display.running { color: var(--danger-color); }

        .hint {
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
            position: absolute;
            bottom: 20px;
        }

        .penalty-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn-penalty {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #94a3b8;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-penalty.active {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        /* PANEL PHẢI: BẢNG XẾP HẠNG */
        .right-panel {
            flex: 0 0 520px;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .leaderboard-header h2 {
            font-size: 1.05rem;
            margin: 0;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .date-picker {
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }

        .badge {
            background: #334155;
            color: #cbd5e1;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 6px;
        }

        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: #0f172a; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px 4px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .rank-1 { color: var(--gold); font-weight: bold; }
        .rank-2 { color: var(--silver); font-weight: bold; }
        .rank-3 { color: var(--bronze); font-weight: bold; }
        .empty-msg {
            color: #64748b;
            padding: 20px;
            text-align: center;
            font-style: italic;
        }

        /* Nút chung */
        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            text-align: center;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        .btn-reset { background: var(--danger-color); color: white; }
        .btn-reset:hover { background: #dc2626; }

        /* Responsive cho màn hình nhỏ */
        @media (max-width: 1100px) {
            .main-layout { flex-direction: column; overflow-y: auto; }
            .left-panel, .right-panel, .center-panel { flex: none; width: 100%; }
            .center-panel { padding: 40px 16px; }
            .timer-display { font-size: 4.5rem; }
            .hint { position: relative; bottom: 0; margin-top: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Rubik Timer HCC</h1>
        <div class="user-nav-group">
            <span class="user-badge" id="user-display">Chưa đăng nhập</span>
            <a href="index.html" class="nav-btn">
                <span>👤</span> Trang chủ / Tài khoản
            </a>
        </div>
    </header>

    <div class="scramble-box" id="scramble">Đang khởi tạo scramble...</div>

    <div class="main-layout">
        <!-- BẢNG THÀNH TÍCH TRÁI -->
        <div class="panel left-panel">
            <h3 class="panel-title">Thành tích cá nhân</h3>
            <div class="solves-list">
                <div class="solve-pill" id="p1">1: --</div>
                <div class="solve-pill" id="p2">2: --</div>
                <div class="solve-pill" id="p3">3: --</div>
                <div class="solve-pill" id="p4">4: --</div>
                <div class="solve-pill" id="p5">5: --</div>
            </div>

            <div class="ao5-summary">
                Ao5: <span id="ao5-val">--</span>
            </div>

            <div class="actions-group">
                <button class="btn" id="btn-save" onclick="saveToLeaderboard()">Lưu BXH Hôm Nay</button>
                <button class="btn btn-reset" id="btn-reset" onclick="resetSession()">Làm mới / Reset</button>
            </div>
        </div>

        <!-- KHU VỰC BẤM GIỜ Ở GIỮA -->
        <div class="panel center-panel">
            <div class="timer-display" id="timer">0.00</div>
            
            <div class="penalty-bar" id="penalty-bar" style="display: none;">
                <button class="btn-penalty" id="btn-plus2" onclick="togglePenalty('+2')">Phạt +2s</button>
                <button class="btn-penalty" id="btn-dnf" onclick="togglePenalty('DNF')">Phạt DNF</button>
            </div>

            <div class="hint" id="hint-msg">Nhấn <b>SPACE</b> để bắt đầu 15s quan sát | Nhấn giữ <b>SPACE</b> để chuẩn bị giải</div>
        </div>

        <!-- BẢNG XẾP HẠNG PHẢI -->
        <div class="panel right-panel">
            <div class="leaderboard-header">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <h2>BẢNG XẾP HẠNG</h2>
                    <input type="date" id="leaderboard-date" class="date-picker" onchange="onDateChange()">
                </div>
                <span class="badge" id="total-participants">0 Thí sinh</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Hạng</th>
                            <th>Thí sinh</th>
                            <th>L1</th>
                            <th>L2</th>
                            <th>L3</th>
                            <th>L4</th>
                            <th>L5</th>
                            <th>Tốt nhất</th>
                            <th>Ao5</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script>
        const SUPABASE_URL = "https://bmglojinjtodeczsgjxh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1e-mCasKT2Vu1FtER3_Dgw_3uUqTuep";
        const TABLE = "rubik_scores";
        
        let client = null;
        try {
            if (window.supabase) {
                client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage }
                });
            }
        } catch (e) {
            console.warn("Chế độ ngoại tuyến hoặc không thể nạp Supabase SDK", e);
        }

        let user = null;
        let currentSolves = [];
        let timerState = 'idle';
        let inspectionInterval = null;
        let inspectionStart = 0;
        let currentSolvePenalty = 'OK';
        let holdTimeout = null;
        let startTime = 0;
        let timerInterval = null;

        const moves = ["R", "L", "U", "D", "F", "B"];
        const modifiers = ["", "'", "2"];

        // Lấy tài khoản liên kết từ index
        function getLinkedAccountFromIndex() {
            if (user) {
                const name = user.user_metadata?.display_name || user.email?.split('@')[0] || "Cuber";
                return { id: user.id, name: name };
            }

            const storageKeys = ['currentUser', 'username', 'rubik_user', 'user', 'account', 'loggedInUser', 'user_account'];
            for (let key of storageKeys) {
                let val = localStorage.getItem(key) || sessionStorage.getItem(key);
                if (val) {
                    try {
                        let parsed = JSON.parse(val);
                        if (typeof parsed === 'object' && parsed !== null) {
                            let name = parsed.display_name || parsed.name || parsed.username || parsed.email?.split('@')[0];
                            if (name) return { id: parsed.id || name, name: name };
                        } else if (typeof parsed === 'string' && parsed.trim() !== '') {
                            return { id: parsed, name: parsed };
                        }
                    } catch (e) {
                        if (typeof val === 'string' && val.trim() !== '') {
                            return { id: val, name: val };
                        }
                    }
                }
            }

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('-auth-token') || key.includes('supabase'))) {
                    try {
                        const sessionData = JSON.parse(localStorage.getItem(key));
                        const userObj = sessionData?.user || sessionData?.currentSession?.user;
                        if (userObj) {
                            const name = userObj.user_metadata?.display_name || userObj.email?.split('@')[0] || "Player";
                            return { id: userObj.id, name: name };
                        }
                    } catch (e) {}
                }
            }

            return null;
        }

        function getAxis(move) {
            if (move === "R" || move === "L") return 0;
            if (move === "U" || move === "D") return 1;
            if (move === "F" || move === "B") return 2;
            return -1;
        }

        function generateScramble() {
            try {
                let scramble = [];
                let lastMove = "";
                let secondLastMove = "";

                for (let i = 0; i < 20; i++) {
                    let validMoves = moves.filter(m => {
                        if (m === lastMove) return false;
                        if (getAxis(m) === getAxis(lastMove) && getAxis(m) === getAxis(secondLastMove)) return false;
                        return true;
                    });

                    let move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
                    scramble.push(move + mod);

                    secondLastMove = lastMove;
                    lastMove = move;
                }
                const el = document.getElementById('scramble');
                if (el) el.innerText = scramble.join(" ");
            } catch (e) {
                console.error("Lỗi khi tạo scramble:", e);
            }
        }

        function getTodayString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function isSelectedToday() {
            const el = document.getElementById('leaderboard-date');
            const selectedDate = el && el.value ? el.value : getTodayString();
            return selectedDate === getTodayString();
        }

        function onDateChange() {
            renderLeaderboard();
            updateUIForSelectedDate();
        }

        function updateUIForSelectedDate() {
            const btnSave = document.getElementById('btn-save');
            const hintMsg = document.getElementById('hint-msg');
            const dateEl = document.getElementById('leaderboard-date');
            const selectedDate = dateEl && dateEl.value ? dateEl.value : getTodayString();

            if (!isSelectedToday()) {
                if (btnSave) {
                    btnSave.disabled = true;
                    btnSave.innerText = "Chỉ Được Xem BXH Cũ";
                }
                if (hintMsg) {
                    hintMsg.innerHTML = `👁️ Đang xem ngày <b>${selectedDate}</b>. Đổi về ngày hôm nay (<b>${getTodayString()}</b>) để thi đấu!`;
                }
            } else {
                updateAccountDisplay();
            }
        }

        async function checkUserSession() {
            const userDisplay = document.getElementById('user-display');

            if (client) {
                try {
                    const { data } = await client.auth.getSession();
                    if (data?.session?.user) {
                        user = data.session.user;
                    }
                } catch (e) {}
            }

            const linkedAcc = getLinkedAccountFromIndex();

            if (linkedAcc) {
                if (userDisplay) {
                    userDisplay.innerText = `👤 ${linkedAcc.name}`;
                    userDisplay.style.borderColor = "var(--accent-color)";
                    userDisplay.style.color = "var(--accent-color)";
                }
            } else {
                if (userDisplay) {
                    userDisplay.innerText = "⚠️ Chưa Đăng Nhập";
                    userDisplay.style.borderColor = "var(--danger-color)";
                    userDisplay.style.color = "var(--danger-color)";
                }
            }

            updateUIForSelectedDate();
            await renderLeaderboard();
        }

        function updateAccountDisplay() {
            const btnSave = document.getElementById('btn-save');
            const hintMsg = document.getElementById('hint-msg');
            const linkedAcc = getLinkedAccountFromIndex();

            if (!isSelectedToday()) return;

            if (!linkedAcc) {
                if (btnSave) {
                    btnSave.disabled = true;
                    btnSave.innerText = "Vui Lòng Đăng Nhập";
                }
                if (hintMsg) {
                    hintMsg.innerHTML = "⚠️ Vui lòng đăng nhập ở <a href='./index.html' style='color:var(--accent-color)'>Trang chủ</a> để thi!";
                }
            } else {
                if (btnSave) {
                    btnSave.disabled = false;
                    btnSave.innerText = "Lưu BXH Hôm Nay";
                }
                if (hintMsg) {
                    hintMsg.innerHTML = "Nhấn <b>SPACE</b> để bắt đầu 15s quan sát | Nhấn giữ <b>SPACE</b> để chuẩn bị giải";
                }
            }
        }

        function formatSolve(solve) {
            if (!solve) return "--";
            if (solve.penalty === 'DNF') return "DNF";
            if (solve.penalty === '+2') return (solve.rawTime + 2).toFixed(2) + "+";
            return solve.rawTime.toFixed(2);
        }

        function getNumericValue(solve) {
            if (!solve || solve.penalty === 'DNF') return Infinity;
            if (solve.penalty === '+2') return solve.rawTime + 2;
            return solve.rawTime;
        }

        function calculateAo5(solves) {
            if (solves.length < 5) return null;
            let times = solves.map(s => getNumericValue(s));
            let dnfCount = times.filter(t => t === Infinity).length;
            if (dnfCount >= 2) return "DNF";

            let sorted = [...times].sort((a, b) => a - b);
            let middle3 = sorted.slice(1, 4);
            let sum = middle3.reduce((acc, val) => acc + val, 0);
            let avg = sum / 3;
            return Math.round(avg * 100) / 100;
        }

        function updateSessionUI() {
            for (let i = 1; i <= 5; i++) {
                let pill = document.getElementById(`p${i}`);
                if (pill) {
                    pill.classList.remove('best', 'worst');
                    let solve = currentSolves[i - 1];
                    pill.innerText = solve ? `${i}: ${formatSolve(solve)}` : `${i}: --`;
                }
            }

            if (currentSolves.length === 5) {
                let numericTimes = currentSolves.map((s, idx) => ({ val: getNumericValue(s), idx }));
                numericTimes.sort((a, b) => a.val - b.val);
                
                let minIdx = numericTimes[0].idx;
                let maxIdx = numericTimes[4].idx;

                let minPill = document.getElementById(`p${minIdx + 1}`);
                let maxPill = document.getElementById(`p${maxIdx + 1}`);
                if (minPill) minPill.classList.add('best');
                if (maxPill) maxPill.classList.add('worst');

                let ao5 = calculateAo5(currentSolves);
                let ao5El = document.getElementById('ao5-val');
                if (ao5El) ao5El.innerText = typeof ao5 === 'number' ? ao5.toFixed(2) + "s" : ao5;
            } else {
                let ao5El = document.getElementById('ao5-val');
                if (ao5El) ao5El.innerText = "--";
            }
        }

        async function renderLeaderboard() {
            const dateEl = document.getElementById('leaderboard-date');
            const selectedDate = dateEl && dateEl.value ? dateEl.value : getTodayString();
            const tbody = document.getElementById('leaderboard-body');
            if (!tbody) return;

            tbody.innerHTML = '<tr><td colspan="9" class="empty-msg">Đang tải dữ liệu Bảng Xếp Hạng...</td></tr>';

            let dailyEntries = [];
            const linkedAcc = getLinkedAccountFromIndex();

            if (client) {
                try {
                    const { data, error } = await client.from(TABLE).select('*').eq('cube_type', '333_ao5').order('created_at', { ascending: true });
                    if (!error && data) {
                        const dailyRows = data.filter(row => row && row.created_at && row.created_at.startsWith(selectedDate));
                        const userMap = new Map();
                        for (const row of dailyRows) {
                            if (!userMap.has(row.user_id) && !userMap.has(row.player_name)) {
                                userMap.set(row.user_id || row.player_name, row);
                            }
                        }
                        dailyEntries = Array.from(userMap.values());
                        dailyEntries.sort((a, b) => (a.raw_ms || 999999) - (b.raw_ms || 999999));

                        tbody.innerHTML = '';
                        if (dailyEntries.length === 0) {
                            tbody.innerHTML = `<tr><td colspan="9" class="empty-msg">Chưa có kết quả nào trong ngày ${selectedDate}.</td></tr>`;
                            let countEl = document.getElementById('total-participants');
                            if (countEl) countEl.innerText = '0 Thí sinh';
                        } else {
                            let countEl = document.getElementById('total-participants');
                            if (countEl) countEl.innerText = `${dailyEntries.length} Thí sinh`;

                            dailyEntries.forEach((entry, index) => {
                                const tr = document.createElement('tr');
                                let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                                let details = { solves: ['--', '--', '--', '--', '--'], best: '--' };
                                try { details = JSON.parse(entry.scramble); } catch (e) {}
                                let ao5Str = (entry.penalty === 'DNF' || !entry.solve_time || entry.solve_time >= 9999) ? "DNF" : entry.solve_time.toFixed(2) + "s";

                                tr.innerHTML = `
                                    <td class="${rankClass}">${index + 1}</td>
                                    <td style="font-weight: 600;">${entry.player_name || 'Cuber'}</td>
                                    <td>${details.solves ? details.solves[0] || '--' : '--'}</td>
                                    <td>${details.solves ? details.solves[1] || '--' : '--'}</td>
                                    <td>${details.solves ? details.solves[2] || '--' : '--'}</td>
                                    <td>${details.solves ? details.solves[3] || '--' : '--'}</td>
                                    <td>${details.solves ? details.solves[4] || '--' : '--'}</td>
                                    <td style="color: #22c55e;">${details.best || '--'}</td>
                                    <td style="font-weight: bold; color: var(--accent-color);">${ao5Str}</td>
                                `;
                                tbody.appendChild(tr);
                            });
                        }

                        // Sửa lỗi check đã hoàn thành trong ngày
                        if (isSelectedToday() && linkedAcc) {
                            const doneToday = dailyRows.some(row => (user && row.user_id === user.id) || (row.player_name === linkedAcc.name));
                            const btnSave = document.getElementById('btn-save');
                            if (doneToday && btnSave) {
                                btnSave.disabled = true;
                                btnSave.innerText = "Đã Thi Hôm Nay";
                                let hintEl = document.getElementById('hint-msg');
                                if (hintEl) hintEl.innerText = "⚠️ Bạn đã hoàn thành lượt thi Ao5 hôm nay! Hãy quay lại vào ngày mai.";
                            }
                        }
                        return;
                    }
                } catch (e) {
                    console.warn("Lỗi tải BXH từ Supabase:", e);
                }
            }

            // Fallback Offline LocalStorage
            let localData = JSON.parse(localStorage.getItem('rubik_hcc_leaderboard_daily')) || [];
            let filteredLocal = localData.filter(e => e && e.date === selectedDate);
            filteredLocal.sort((a, b) => (a.ao5 === "DNF" ? 1 : b.ao5 === "DNF" ? -1 : a.ao5 - b.ao5));

            tbody.innerHTML = '';
            if (filteredLocal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-msg">Chưa có kết quả nào trong ngày ${selectedDate}.</td></tr>`;
                let countEl = document.getElementById('total-participants');
                if (countEl) countEl.innerText = '0 Thí sinh';
            } else {
                let countEl = document.getElementById('total-participants');
                if (countEl) countEl.innerText = `${filteredLocal.length} Thí sinh`;

                filteredLocal.forEach((entry, index) => {
                    const tr = document.createElement('tr');
                    let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                    let ao5Str = typeof entry.ao5 === 'number' ? entry.ao5.toFixed(2) + "s" : "DNF";
                    let bestStr = entry.best === Infinity ? "DNF" : entry.best.toFixed(2);

                    tr.innerHTML = `
                        <td class="${rankClass}">${index + 1}</td>
                        <td style="font-weight: 600;">${entry.name}</td>
                        <td>${entry.solves[0]}</td>
                        <td>${entry.solves[1]}</td>
                        <td>${entry.solves[2]}</td>
                        <td>${entry.solves[3]}</td>
                        <td>${entry.solves[4]}</td>
                        <td style="color: #22c55e;">${bestStr}</td>
                        <td style="font-weight: bold; color: var(--accent-color);">${ao5Str}</td>
                    `;
                    tbody.appendChild(tr);
                });
                
                if (isSelectedToday() && linkedAcc) {
                    const doneToday = filteredLocal.some(row => row.name === linkedAcc.name);
                    const btnSave = document.getElementById('btn-save');
                    if (doneToday && btnSave) {
                        btnSave.disabled = true;
                        btnSave.innerText = "Đã Thi Hôm Nay";
                        let hintEl = document.getElementById('hint-msg');
                        if (hintEl) hintEl.innerText = "⚠️ Bạn đã hoàn thành lượt thi Ao5 hôm nay! Hãy quay lại vào ngày mai.";
                    }
                }
            }
        }

        async function saveToLeaderboard() {
            if (!isSelectedToday()) {
                alert("Bạn chỉ được tham gia thi đấu trong ngày HÔM NAY! Các ngày khác chỉ được xem.");
                return;
            }

            const linkedAcc = getLinkedAccountFromIndex();
            if (!linkedAcc) {
                alert("Bạn cần đăng nhập tài khoản ở trang chính (index.html) trước khi thi!");
                return;
            }

            if (currentSolves.length < 5) {
                alert("Bạn cần hoàn thành đủ 5 lượt giải Ao5 để lưu vào Bảng Xếp Hạng!");
                return;
            }

            const today = getTodayString();
            let ao5 = calculateAo5(currentSolves);
            let bestNumeric = Math.min(...currentSolves.map(s => getNumericValue(s)));
            let solveStrings = currentSolves.map(s => formatSolve(s));

            if (client && user) {
                const rawMs = typeof ao5 === 'number' ? Math.round(ao5 * 1000) : 99999999;
                const solveTime = typeof ao5 === 'number' ? ao5 : 99999;
                const penaltyVal = ao5 === 'DNF' ? 'DNF' : 'OK';

                const scramblePayload = JSON.stringify({
                    solves: solveStrings,
                    best: bestNumeric === Infinity ? "DNF" : bestNumeric.toFixed(2)
                });

                const { error } = await client.from(TABLE).insert({
                    user_id: user.id,
                    player_name: linkedAcc.name,
                    scramble: scramblePayload,
                    solve_time: solveTime,
                    raw_ms: rawMs,
                    penalty: penaltyVal,
                    cube_type: '333_ao5',
                    created_at: new Date().toISOString()
                });

                if (error) {
                    alert("Lỗi lưu trực tuyến: " + error.message);
                    return;
                }
            } else {
                let localData = JSON.parse(localStorage.getItem('rubik_hcc_leaderboard_daily')) || [];
                localData.push({
                    name: linkedAcc.name,
                    date: today,
                    solves: solveStrings,
                    best: bestNumeric,
                    ao5: ao5
                });
                localStorage.setItem('rubik_hcc_leaderboard_daily', JSON.stringify(localData));
            }

            alert(`Đã lưu thành công kết quả Ao5 của ${linkedAcc.name}!`);
            let dateEl = document.getElementById('leaderboard-date');
            if (dateEl) dateEl.value = today;
            await renderLeaderboard();
            resetSession();
        }

        function resetSession() {
            currentSolves = [];
            clearInterval(inspectionInterval);
            clearInterval(timerInterval);
            timerState = 'idle';
            inspectionStart = 0;
            currentSolvePenalty = 'OK';
            let timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.className = 'timer-display';
                timerEl.innerText = "0.00";
            }
            let penaltyBar = document.getElementById('penalty-bar');
            if (penaltyBar) penaltyBar.style.display = 'none';
            
            updateUIForSelectedDate();
            updateSessionUI();
            generateScramble();
        }

        function togglePenalty(type) {
            if (currentSolves.length === 0) return;
            let lastIndex = currentSolves.length - 1;
            let solve = currentSolves[lastIndex];

            if (solve.penalty === type) {
                solve.penalty = 'OK';
            } else {
                solve.penalty = type;
            }

            let btn2 = document.getElementById('btn-plus2');
            let btnD = document.getElementById('btn-dnf');
            if (btn2) btn2.classList.toggle('active', solve.penalty === '+2');
            if (btnD) btnD.classList.toggle('active', solve.penalty === 'DNF');

            let timerEl = document.getElementById('timer');
            if (timerEl) timerEl.innerText = formatSolve(solve);
            updateSessionUI();
        }

        function startInspection() {
            timerState = 'inspection';
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.className = 'timer-display inspection';
                timerEl.innerText = 15;
            }

            inspectionStart = Date.now();
            inspectionInterval = setInterval(() => {
                let elapsed = (Date.now() - inspectionStart) / 1000;
                let remaining = Math.ceil(15 - elapsed);

                if (timerEl) {
                    if (elapsed >= 17) {
                        timerEl.innerText = "DNF";
                        timerEl.className = "timer-display running";
                    } else if (elapsed >= 15) {
                        timerEl.innerText = "+2";
                        timerEl.className = "timer-display holding";
                    } else {
                        timerEl.innerText = remaining > 0 ? remaining : 1;
                    }
                }
            }, 50);
        }

        function startTimer() {
            if (inspectionStart > 0) {
                let inspElapsed = (Date.now() - inspectionStart) / 1000;
                if (inspElapsed >= 17) {
                    currentSolvePenalty = 'DNF';
                } else if (inspElapsed >= 15) {
                    currentSolvePenalty = '+2';
                } else {
                    currentSolvePenalty = 'OK';
                }
            } else {
                currentSolvePenalty = 'OK';
            }

            clearInterval(inspectionInterval);
            startTime = Date.now();
            timerState = 'running';
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.className = 'timer-display running';
            }
            let pBar = document.getElementById('penalty-bar');
            if (pBar) pBar.style.display = 'none';

            timerInterval = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                if (timerEl) timerEl.innerText = elapsed.toFixed(2);
            }, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            let elapsed = (Date.now() - startTime) / 1000;
            const timerEl = document.getElementById('timer');
            if (timerEl) timerEl.className = 'timer-display';
            timerState = 'idle';

            let newSolve = {
                rawTime: elapsed,
                penalty: currentSolvePenalty
            };

            if (currentSolves.length < 5) {
                currentSolves.push(newSolve);
                if (timerEl) timerEl.innerText = formatSolve(newSolve);
                
                let pBar = document.getElementById('penalty-bar');
                if (pBar) pBar.style.display = 'flex';
                let btn2 = document.getElementById('btn-plus2');
                let btnD = document.getElementById('btn-dnf');
                if (btn2) btn2.classList.toggle('active', currentSolvePenalty === '+2');
                if (btnD) btnD.classList.toggle('active', currentSolvePenalty === 'DNF');

                updateSessionUI();
                generateScramble();
            }
        }

        window.saveToLeaderboard = saveToLeaderboard;
        window.resetSession = resetSession;
        window.togglePenalty = togglePenalty;
        window.onDateChange = onDateChange;

        window.addEventListener('storage', () => {
            checkUserSession();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (!isSelectedToday()) {
                    alert("Bạn đang ở chế độ xem Bảng Xếp Hạng ngày khác! Chỉ được phép thi đấu trong ngày HÔM NAY.");
                    return;
                }

                const linkedAcc = getLinkedAccountFromIndex();
                if (!linkedAcc) {
                    alert("Vui lòng đăng nhập ở trang chính (index.html) trước khi thi!");
                    return;
                }

                if (timerState === 'running') {
                    stopTimer();
                } else if (timerState === 'idle' && currentSolves.length < 5) {
                    startInspection();
                } else if (timerState === 'inspection') {
                    timerState = 'holding';
                    let tEl = document.getElementById('timer');
                    if (tEl) tEl.className = 'timer-display holding';
                    holdTimeout = setTimeout(() => {
                        timerState = 'ready';
                        if (tEl) tEl.className = 'timer-display ready';
                    }, 300);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (!isSelectedToday()) return;

                if (timerState === 'holding') {
                    clearTimeout(holdTimeout);
                    timerState = 'inspection';
                    let tEl = document.getElementById('timer');
                    if (tEl) tEl.className = 'timer-display inspection';
                } else if (timerState === 'ready') {
                    startTimer();
                }
            }
        });

        function initApp() {
            const dateEl = document.getElementById('leaderboard-date');
            if (dateEl) dateEl.value = getTodayString();
            
            const btnSave = document.getElementById('btn-save');
            const btnReset = document.getElementById('btn-reset');
            if (btnSave) btnSave.onclick = saveToLeaderboard;
            if (btnReset) btnReset.onclick = resetSession;

            generateScramble();
            checkUserSession();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
