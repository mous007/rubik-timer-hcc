<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Timer HCC - Chế Độ Ao5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --border-color: #334155;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 12px 20px;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navigation / Header */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            background: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            border: 1px solid var(--border-color);
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        /* Scramble Box */
        .scramble-box {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #f1f5f9;
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 900px;
            width: 100%;
            flex-shrink: 0;
        }

        /* Timer Display */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
            flex-shrink: 0;
            position: relative;
        }

        .timer-display {
            font-size: 4.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            line-height: 1;
            transition: color 0.1s ease;
        }

        .timer-display.inspection { color: var(--warning-color); }
        .timer-display.holding { color: var(--warning-color); }
        .timer-display.ready { color: var(--success-color); }
        .timer-display.running { color: var(--danger-color); }

        .hint {
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        /* Penalty Buttons (+2, DNF) for current solve */
        .penalty-bar {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-penalty {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #94a3b8;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-penalty.active {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        /* Status Bar (Solves inline & Controls) */
        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .solves-inline {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .solve-pill {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            min-width: 65px;
            text-align: center;
        }

        .solve-pill.best { border-color: var(--success-color); color: #4ade80; font-weight: bold; }
        .solve-pill.worst { border-color: var(--danger-color); color: #f87171; font-weight: bold; }

        .ao5-summary {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--accent-color);
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px dashed var(--accent-color);
        }

        .actions-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="text"] {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 0.85rem;
            outline: none;
            width: 130px;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.96); }

        .btn-reset {
            background: var(--danger-color);
            color: white;
        }
        .btn-reset:hover { background: #dc2626; }

        /* Leaderboard Box */
        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 900px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .leaderboard-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--accent-color);
        }

        .badge {
            background: #334155;
            color: #cbd5e1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 6px;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.88rem;
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .rank-1 { color: var(--gold); font-weight: bold; }
        .rank-2 { color: var(--silver); font-weight: bold; }
        .rank-3 { color: var(--bronze); font-weight: bold; }
        .empty-msg {
            color: #64748b;
            padding: 20px;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rubik Timer HCC</h1>
        <div class="nav-links">
            <!-- Nút kết nối tài khoản & quay về index.html -->
            <a href="index.html" class="nav-btn">
                <span>&#128100;</span> Tài khoản / Trang chủ
            </a>
        </div>
    </header>

    <div class="scramble-box" id="scramble">Đang khởi tạo scramble...</div>

    <div class="timer-container">
        <div class="timer-display" id="timer">0.00</div>
        <div class="penalty-bar" id="penalty-bar" style="display: none;">
            <button class="btn-penalty" id="btn-plus2" onclick="togglePenalty('+2')">+2</button>
            <button class="btn-penalty" id="btn-dnf" onclick="togglePenalty('DNF')">DNF</button>
        </div>
    </div>
    <div class="hint" id="hint-msg">Nhấn <b>SPACE</b> để bắt đầu 15s quan sát (Inspection) | Nhấn giữ <b>SPACE</b> để chuẩn bị giải</div>

    <!-- Thanh trạng thái lượt giải & Nhập kết quả -->
    <div class="status-bar">
        <div class="solves-inline">
            <div class="solve-pill" id="p1">1: --</div>
            <div class="solve-pill" id="p2">2: --</div>
            <div class="solve-pill" id="p3">3: --</div>
            <div class="solve-pill" id="p4">4: --</div>
            <div class="solve-pill" id="p5">5: --</div>
        </div>

        <div class="ao5-summary">
            Ao5: <span id="ao5-val">--</span>
        </div>

        <div class="actions-group">
            <input type="text" id="player-name" placeholder="Tên thí sinh...">
            <button class="btn" onclick="saveToLeaderboard()">Lưu BXH</button>
            <button class="btn btn-reset" onclick="resetSession()">Reset</button>
        </div>
    </div>

    <!-- Bảng Xếp Hạng Cố Định Của Màn Hình -->
    <div class="leaderboard-card">
        <div class="leaderboard-header">
            <h2>BẢNG XẾP HẠNG GIẢI ĐUA</h2>
            <span class="badge" id="total-participants">0 Thí sinh</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Hạng</th>
                        <th>Thí sinh</th>
                        <th>Lần 1</th>
                        <th>Lần 2</th>
                        <th>Lần 3</th>
                        <th>Lần 4</th>
                        <th>Lần 5</th>
                        <th>Tốt nhất</th>
                        <th>Ao5</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Javascript sẽ đổ dữ liệu vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Bảng xếp hạng khởi tạo rỗng (Đã xóa dữ liệu ví dụ)
        let leaderboard = JSON.parse(localStorage.getItem('rubik_hcc_leaderboard')) || [];

        let currentSolves = []; // Lưu danh sách lượt giải: { rawTime: number, penalty: 'OK'|'+2'|'DNF', finalTime: number }
        let timerState = 'idle'; // idle, inspection, holding, ready, running
        let inspectionTime = 15;
        let inspectionInterval = null;
        let inspectionStart = 0;
        let holdTimeout = null;
        let startTime = 0;
        let timerInterval = null;

        const moves = ["R", "L", "U", "D", "F", "B"];
        const modifiers = ["", "'", "2"];

        function generateScramble() {
            let scramble = [];
            let lastMove = "";
            for (let i = 0; i < 20; i++) {
                let move;
                do {
                    move = moves[Math.floor(Math.random() * moves.length)];
                } while (move === lastMove);
                lastMove = move;
                let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(move + mod);
            }
            document.getElementById('scramble').innerText = scramble.join(" ");
        }

        // Format thời gian hiển thị (+2 hay DNF)
        function formatSolve(solve) {
            if (!solve) return "--";
            if (solve.penalty === 'DNF') return "DNF";
            if (solve.penalty === '+2') return (solve.rawTime + 2).toFixed(2) + "+";
            return solve.rawTime.toFixed(2);
        }

        function getNumericValue(solve) {
            if (!solve || solve.penalty === 'DNF') return Infinity;
            if (solve.penalty === '+2') return solve.rawTime + 2;
            return solve.rawTime;
        }

        function calculateAo5(solves) {
            if (solves.length < 5) return null;
            let times = solves.map(s => getNumericValue(s));
            
            // Nếu từ 2 lần DNF trở lên -> Ao5 là DNF
            let dnfCount = times.filter(t => t === Infinity).length;
            if (dnfCount >= 2) return "DNF";

            let sorted = [...times].sort((a, b) => a - b);
            // Loại bỏ 1 lần tốt nhất (index 0) và 1 lần tệ nhất (index 4)
            let middle3 = sorted.slice(1, 4);
            let sum = middle3.reduce((acc, val) => acc + val, 0);
            let avg = sum / 3;
            return Math.round(avg * 100) / 100;
        }

        function updateSessionUI() {
            for (let i = 1; i <= 5; i++) {
                let pill = document.getElementById(`p${i}`);
                pill.classList.remove('best', 'worst');

                let solve = currentSolves[i - 1];
                if (solve) {
                    pill.innerText = `${i}: ${formatSolve(solve)}`;
                } else {
                    pill.innerText = `${i}: --`;
                }
            }

            if (currentSolves.length === 5) {
                let numericTimes = currentSolves.map((s, idx) => ({ val: getNumericValue(s), idx }));
                numericTimes.sort((a, b) => a.val - b.val);
                
                let minIdx = numericTimes[0].idx;
                let maxIdx = numericTimes[4].idx;

                document.getElementById(`p${minIdx + 1}`).classList.add('best');
                document.getElementById(`p${maxIdx + 1}`).classList.add('worst');

                let ao5 = calculateAo5(currentSolves);
                document.getElementById('ao5-val').innerText = typeof ao5 === 'number' ? ao5.toFixed(2) + "s" : ao5;
            } else {
                document.getElementById('ao5-val').innerText = "--";
            }
        }

        function renderLeaderboard() {
            // Sắp xếp theo Ao5 (DNF xếp cuối)
            leaderboard.sort((a, b) => {
                if (a.ao5 === "DNF") return 1;
                if (b.ao5 === "DNF") return -1;
                return a.ao5 - b.ao5;
            });

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (leaderboard.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-msg">Chưa có kết quả nào. Hãy hoàn thành lượt giải để lưu vào bảng xếp hạng!</td></tr>';
                document.getElementById('total-participants').innerText = '0 Thí sinh';
                return;
            }

            leaderboard.forEach((entry, index) => {
                const tr = document.createElement('tr');
                let rankClass = '';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';

                let ao5Str = typeof entry.ao5 === 'number' ? entry.ao5.toFixed(2) + "s" : "DNF";
                let bestStr = entry.best === Infinity ? "DNF" : entry.best.toFixed(2);

                tr.innerHTML = `
                    <td class="${rankClass}">${index + 1}</td>
                    <td style="font-weight: 600;">${entry.name}</td>
                    <td>${entry.solves[0]}</td>
                    <td>${entry.solves[1]}</td>
                    <td>${entry.solves[2]}</td>
                    <td>${entry.solves[3]}</td>
                    <td>${entry.solves[4]}</td>
                    <td style="color: #22c55e;">${bestStr}</td>
                    <td style="font-weight: bold; color: var(--accent-color);">${ao5Str}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-participants').innerText = `${leaderboard.length} Thí sinh`;
        }

        function saveToLeaderboard() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim();

            if (!name) {
                alert("Vui lòng nhập tên thí sinh!");
                return;
            }

            if (currentSolves.length < 5) {
                alert("Bạn cần hoàn thành đủ 5 lượt giải Ao5 để lưu vào Bảng Xếp Hạng!");
                return;
            }

            let ao5 = calculateAo5(currentSolves);
            let bestNumeric = Math.min(...currentSolves.map(s => getNumericValue(s)));

            let solveStrings = currentSolves.map(s => formatSolve(s));

            leaderboard.push({
                name: name,
                solves: solveStrings,
                best: bestNumeric,
                ao5: ao5
            });

            localStorage.setItem('rubik_hcc_leaderboard', JSON.stringify(leaderboard));
            renderLeaderboard();
            nameInput.value = '';
            resetSession();
            alert(`Đã lưu thành tích Ao5 của ${name} vào Bảng Xếp Hạng!`);
        }

        function resetSession() {
            currentSolves = [];
            clearInterval(inspectionInterval);
            clearInterval(timerInterval);
            timerState = 'idle';
            document.getElementById('timer').className = 'timer-display';
            document.getElementById('timer').innerText = "0.00";
            document.getElementById('penalty-bar').style.display = 'none';
            document.getElementById('hint-msg').innerHTML = "Nhấn <b>SPACE</b> để bắt đầu 15s quan sát (Inspection) | Nhấn giữ <b>SPACE</b> để chuẩn bị giải";
            updateSessionUI();
            generateScramble();
        }

        // Xử lý phạt +2 / DNF cho lượt giải vừa hoàn thành
        function togglePenalty(type) {
            if (currentSolves.length === 0) return;
            let lastIndex = currentSolves.length - 1;
            let solve = currentSolves[lastIndex];

            if (solve.penalty === type) {
                solve.penalty = 'OK';
            } else {
                solve.penalty = type;
            }

            document.getElementById('btn-plus2').classList.toggle('active', solve.penalty === '+2');
            document.getElementById('btn-dnf').classList.toggle('active', solve.penalty === 'DNF');

            document.getElementById('timer').innerText = formatSolve(solve);
            updateSessionUI();
        }

        // Bắt đầu 15s Inspection
        function startInspection() {
            timerState = 'inspection';
            inspectionTime = 15;
            const timerEl = document.getElementById('timer');
            timerEl.className = 'timer-display inspection';
            timerEl.innerText = inspectionTime;

            inspectionStart = Date.now();
            inspectionInterval = setInterval(() => {
                let elapsed = Math.floor((Date.now() - inspectionStart) / 1000);
                let remaining = 15 - elapsed;

                if (remaining > 0) {
                    timerEl.innerText = remaining;
                } else if (remaining === 0 || remaining === -1) {
                    timerEl.innerText = "+2";
                } else {
                    timerEl.innerText = "DNF";
                    clearInterval(inspectionInterval);
                }
            }, 500);
        }

        function startTimer() {
            clearInterval(inspectionInterval);
            startTime = Date.now();
            timerState = 'running';
            const timerEl = document.getElementById('timer');
            timerEl.className = 'timer-display running';
            document.getElementById('penalty-bar').style.display = 'none';

            timerInterval = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                timerEl.innerText = elapsed.toFixed(2);
            }, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            let elapsed = (Date.now() - startTime) / 1000;
            const timerEl = document.getElementById('timer');
            timerEl.className = 'timer-display';
            timerState = 'idle';

            let initialPenalty = 'OK';
            // Kiểm tra xem lúc khởi chạy timer đang ở mức +2 hay DNF do quá thời gian inspection
            let inspectionElapsed = (Date.now() - inspectionStart) / 1000;
            if (inspectionStart > 0) {
                if (inspectionElapsed > 17) {
                    initialPenalty = 'DNF';
                } else if (inspectionElapsed > 15) {
                    initialPenalty = '+2';
                }
            }

            let newSolve = {
                rawTime: elapsed,
                penalty: initialPenalty
            };

            if (currentSolves.length < 5) {
                currentSolves.push(newSolve);
                timerEl.innerText = formatSolve(newSolve);
                
                // Hiển thị nút phạt +2 / DNF cho lượt vừa bấm
                document.getElementById('penalty-bar').style.display = 'flex';
                document.getElementById('btn-plus2').classList.toggle('active', initialPenalty === '+2');
                document.getElementById('btn-dnf').classList.toggle('active', initialPenalty === 'DNF');

                updateSessionUI();
                generateScramble();
            }
        }

        // Xử lý sự kiện bàn phím (SPACE)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (timerState === 'running') {
                    stopTimer();
                } else if (timerState === 'idle' && currentSolves.length < 5) {
                    startInspection();
                } else if (timerState === 'inspection') {
                    timerState = 'holding';
                    document.getElementById('timer').className = 'timer-display holding';
                    holdTimeout = setTimeout(() => {
                        timerState = 'ready';
                        document.getElementById('timer').className = 'timer-display ready';
                    }, 300);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();

                if (timerState === 'holding') {
                    clearTimeout(holdTimeout);
                    timerState = 'inspection';
                    document.getElementById('timer').className = 'timer-display inspection';
                } else if (timerState === 'ready') {
                    startTimer();
                }
            }
        });

        // Khởi tạo ban đầu
        generateScramble();
        renderLeaderboard();
    </script>
</body>
</html>
