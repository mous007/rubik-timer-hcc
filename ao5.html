<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Timer HCC - Chế Độ Ao5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --border-color: #334155;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 12px 20px;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .user-nav-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-badge {
            background: #0f172a;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-btn {
            background: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            border: 1px solid var(--border-color);
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        .scramble-box {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #f1f5f9;
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 900px;
            width: 100%;
            flex-shrink: 0;
        }

        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
            flex-shrink: 0;
        }

        .timer-display {
            font-size: 4.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            line-height: 1;
            transition: color 0.1s ease;
        }

        .timer-display.inspection { color: var(--warning-color); }
        .timer-display.holding { color: var(--warning-color); }
        .timer-display.ready { color: var(--success-color); }
        .timer-display.running { color: var(--danger-color); }

        .hint {
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .penalty-bar {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-penalty {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #94a3b8;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-penalty.active {
            background: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .solves-inline {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .solve-pill {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            min-width: 65px;
            text-align: center;
        }

        .solve-pill.best { border-color: var(--success-color); color: #4ade80; font-weight: bold; }
        .solve-pill.worst { border-color: var(--danger-color); color: #f87171; font-weight: bold; }

        .ao5-summary {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--accent-color);
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px dashed var(--accent-color);
        }

        .actions-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        .btn-reset {
            background: var(--danger-color);
            color: white;
        }
        .btn-reset:hover { background: #dc2626; }

        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 900px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .leaderboard-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .leaderboard-header h2 {
            font-size: 1.1rem;
            margin: 0;
            color: var(--accent-color);
        }

        .date-picker {
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }

        .badge {
            background: #334155;
            color: #cbd5e1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border-radius: 6px;
        }

        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: #0f172a; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.88rem;
        }

        th, td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .rank-1 { color: var(--gold); font-weight: bold; }
        .rank-2 { color: var(--silver); font-weight: bold; }
        .rank-3 { color: var(--bronze); font-weight: bold; }
        .empty-msg {
            color: #64748b;
            padding: 20px;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rubik Timer HCC</h1>
        <div class="user-nav-group">
            <span class="user-badge" id="user-display">Chưa đăng nhập</span>
            <a href="index.html" class="nav-btn">
                <span>&#128100;</span> Trang chủ / Tài khoản
            </a>
        </div>
    </header>

    <div class="scramble-box" id="scramble">Đang khởi tạo scramble...</div>

    <div class="timer-container">
        <div class="timer-display" id="timer">0.00</div>
        <div class="penalty-bar" id="penalty-bar" style="display: none;">
            <button class="btn-penalty" id="btn-plus2" onclick="togglePenalty('+2')">+2</button>
            <button class="btn-penalty" id="btn-dnf" onclick="togglePenalty('DNF')">DNF</button>
        </div>
    </div>
    <div class="hint" id="hint-msg">Nhấn <b>SPACE</b> để bắt đầu 15s quan sát | Nhấn giữ <b>SPACE</b> để chuẩn bị giải</div>

    <div class="status-bar">
        <div class="solves-inline">
            <div class="solve-pill" id="p1">1: --</div>
            <div class="solve-pill" id="p2">2: --</div>
            <div class="solve-pill" id="p3">3: --</div>
            <div class="solve-pill" id="p4">4: --</div>
            <div class="solve-pill" id="p5">5: --</div>
        </div>

        <div class="ao5-summary">
            Ao5: <span id="ao5-val">--</span>
        </div>

        <div class="actions-group">
            <button class="btn" id="btn-save" onclick="saveToLeaderboard()">Lưu BXH Hôm Nay</button>
            <button class="btn btn-reset" onclick="resetSession()">Reset</button>
        </div>
    </div>

    <div class="leaderboard-card">
        <div class="leaderboard-header">
            <div class="leaderboard-title-group">
                <h2>BẢNG XẾP HẠNG GIẢI ĐUA</h2>
                <input type="date" id="leaderboard-date" class="date-picker" onchange="onDateChange()">
            </div>
            <span class="badge" id="total-participants">0 Thí sinh</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Hạng</th>
                        <th>Thí sinh</th>
                        <th>Lần 1</th>
                        <th>Lần 2</th>
                        <th>Lần 3</th>
                        <th>Lần 4</th>
                        <th>Lần 5</th>
                        <th>Tốt nhất</th>
                        <th>Ao5</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    <script>
        const SUPABASE_URL = "https://bmglojinjtodeczsgjxh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1e-mCasKT2Vu1FtER3_Dgw_3uUqTuep";
        const TABLE = "rubik_scores";
        
        let client = null;
        try {
            if (window.supabase) {
                client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage }
                });
            }
        } catch (e) {
            console.warn("Chế độ ngoại tuyến hoặc không thể nạp Supabase SDK");
        }

        let user = null;
        let currentSolves = [];
        let timerState = 'idle';
        let inspectionInterval = null;
        let inspectionStart = 0;
        let currentSolvePenalty = 'OK';
        let holdTimeout = null;
        let startTime = 0;
        let timerInterval = null;

        const moves = ["R", "L", "U", "D", "F", "B"];
        const modifiers = ["", "'", "2"];

        function getAxis(move) {
            if (move === "R" || move === "L") return 0;
            if (move === "U" || move === "D") return 1;
            if (move === "F" || move === "B") return 2;
            return -1;
        }

        function generateScramble() {
            let scramble = [];
            let lastMove = "";
            let secondLastMove = "";

            for (let i = 0; i < 20; i++) {
                let validMoves = moves.filter(m => {
                    if (m === lastMove) return false;
                    if (getAxis(m) === getAxis(lastMove) && getAxis(m) === getAxis(secondLastMove)) return false;
                    return true;
                });

                let move = validMoves[Math.floor(Math.random() * validMoves.length)];
                let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(move + mod);

                secondLastMove = lastMove;
                lastMove = move;
            }
            document.getElementById('scramble').innerText = scramble.join(" ");
        }

        function getTodayString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getLocalFallbackUser() {
            let u = localStorage.getItem('currentUser') || localStorage.getItem('username');
            if (u) return u;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('-auth-token')) {
                    try {
                        const sessionData = JSON.parse(localStorage.getItem(key));
                        const userObj = sessionData?.user || sessionData?.currentSession?.user;
                        if (userObj) {
                            return userObj.user_metadata?.display_name || userObj.email?.split('@')[0] || "Player";
                        }
                    } catch (e) {}
                }
            }
            return null;
        }

        // Kiểm tra xem ngày đang chọn có phải ngày HÔM NAY không
        function isSelectedToday() {
            const selectedDate = document.getElementById('leaderboard-date').value;
            return selectedDate === getTodayString();
        }

        // Xử lý sự kiện thay đổi ngày ở ô Lịch
        function onDateChange() {
            renderLeaderboard();
            updateUIForSelectedDate();
        }

        // Cập nhật trạng thái giao diện theo ngày được chọn
        function updateUIForSelectedDate() {
            const btnSave = document.getElementById('btn-save');
            const hintMsg = document.getElementById('hint-msg');
            const selectedDate = document.getElementById('leaderboard-date').value;

            if (!isSelectedToday()) {
                btnSave.disabled = true;
                btnSave.innerText = "Chỉ Được Xem (Chỉ Thi Ngày Hôm Nay)";
                hintMsg.innerHTML = `👁️ Bạn đang xem BXH ngày <b>${selectedDate}</b>. Đổi về ngày hôm nay (<b>${getTodayString()}</b>) để thi đấu!`;
            } else {
                updateAccountDisplay();
            }
        }

        async function checkUserSession() {
            const userDisplay = document.getElementById('user-display');

            if (client) {
                try {
                    const { data } = await client.auth.getSession();
                    if (data?.session?.user) {
                        user = data.session.user;
                        const name = user.user_metadata?.display_name || user.email?.split('@')[0] || "Cuber";
                        userDisplay.innerText = `👤 ${name}`;
                        userDisplay.style.borderColor = "var(--accent-color)";
                        userDisplay.style.color = "var(--accent-color)";
                        updateUIForSelectedDate();
                        return;
                    }
                } catch (e) {}
            }

            let fallbackName = getLocalFallbackUser();
            if (fallbackName) {
                userDisplay.innerText = `👤 ${fallbackName}`;
                userDisplay.style.borderColor = "var(--accent-color)";
                userDisplay.style.color = "var(--accent-color)";
            } else {
                userDisplay.innerText = "⚠️ Chưa Đăng Nhập";
                userDisplay.style.borderColor = "var(--danger-color)";
                userDisplay.style.color = "var(--danger-color)";
            }

            updateUIForSelectedDate();
        }

        function updateAccountDisplay() {
            const btnSave = document.getElementById('btn-save');
            const hintMsg = document.getElementById('hint-msg');
            const activeName = user ? (user.user_metadata?.display_name || user.email?.split('@')[0]) : getLocalFallbackUser();

            if (!isSelectedToday()) {
                btnSave.disabled = true;
                btnSave.innerText = "Chỉ Được Xem (Chỉ Thi Ngày Hôm Nay)";
                hintMsg.innerHTML = `👁️ Bạn đang xem BXH ngày <b>${document.getElementById('leaderboard-date').value}</b>. Hãy chuyển về ngày hôm nay để thi!`;
                return;
            }

            if (!activeName) {
                btnSave.disabled = true;
                btnSave.innerText = "Vui Lòng Đăng Nhập";
                hintMsg.innerHTML = "⚠️ Bạn cần đăng nhập tài khoản ở <a href='./index.html' style='color:var(--accent-color)'>Trang chủ</a> để tham gia thi!";
            } else {
                btnSave.disabled = false;
                btnSave.innerText = "Lưu BXH Hôm Nay";
                hintMsg.innerHTML = "Nhấn <b>SPACE</b> để bắt đầu 15s quan sát | Nhấn giữ <b>SPACE</b> để chuẩn bị giải";
            }
        }

        function formatSolve(solve) {
            if (!solve) return "--";
            if (solve.penalty === 'DNF') return "DNF";
            if (solve.penalty === '+2') return (solve.rawTime + 2).toFixed(2) + "+";
            return solve.rawTime.toFixed(2);
        }

        function getNumericValue(solve) {
            if (!solve || solve.penalty === 'DNF') return Infinity;
            if (solve.penalty === '+2') return solve.rawTime + 2;
            return solve.rawTime;
        }

        function calculateAo5(solves) {
            if (solves.length < 5) return null;
            let times = solves.map(s => getNumericValue(s));
            let dnfCount = times.filter(t => t === Infinity).length;
            if (dnfCount >= 2) return "DNF";

            let sorted = [...times].sort((a, b) => a - b);
            let middle3 = sorted.slice(1, 4);
            let sum = middle3.reduce((acc, val) => acc + val, 0);
            let avg = sum / 3;
            return Math.round(avg * 100) / 100;
        }

        function updateSessionUI() {
            for (let i = 1; i <= 5; i++) {
                let pill = document.getElementById(`p${i}`);
                pill.classList.remove('best', 'worst');

                let solve = currentSolves[i - 1];
                if (solve) {
                    pill.innerText = `${i}: ${formatSolve(solve)}`;
                } else {
                    pill.innerText = `${i}: --`;
                }
            }

            if (currentSolves.length === 5) {
                let numericTimes = currentSolves.map((s, idx) => ({ val: getNumericValue(s), idx }));
                numericTimes.sort((a, b) => a.val - b.val);
                
                let minIdx = numericTimes[0].idx;
                let maxIdx = numericTimes[4].idx;

                document.getElementById(`p${minIdx + 1}`).classList.add('best');
                document.getElementById(`p${maxIdx + 1}`).classList.add('worst');

                let ao5 = calculateAo5(currentSolves);
                document.getElementById('ao5-val').innerText = typeof ao5 === 'number' ? ao5.toFixed(2) + "s" : ao5;
            } else {
                document.getElementById('ao5-val').innerText = "--";
            }
        }

        async function renderLeaderboard() {
            const selectedDate = document.getElementById('leaderboard-date').value;
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="9" class="empty-msg">Đang tải dữ liệu Bảng Xếp Hạng...</td></tr>';

            let dailyEntries = [];

            if (client) {
                try {
                    const { data, error } = await client.from(TABLE).select('*').eq('cube_type', '333_ao5').order('created_at', { ascending: true });
                    if (!error && data) {
                        const dailyRows = data.filter(row => row.created_at.startsWith(selectedDate));
                        const userMap = new Map();
                        for (const row of dailyRows) {
                            if (!userMap.has(row.user_id)) {
                                userMap.set(row.user_id, row);
                            }
                        }
                        dailyEntries = Array.from(userMap.values());
                        dailyEntries.sort((a, b) => a.raw_ms - b.raw_ms);

                        tbody.innerHTML = '';
                        if (dailyEntries.length === 0) {
                            tbody.innerHTML = `<tr><td colspan="9" class="empty-msg">Chưa có kết quả nào trong ngày ${selectedDate}.</td></tr>`;
                            document.getElementById('total-participants').innerText = '0 Thí sinh';
                        } else {
                            document.getElementById('total-participants').innerText = `${dailyEntries.length} Thí sinh`;
                            dailyEntries.forEach((entry, index) => {
                                const tr = document.createElement('tr');
                                let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                                let details = { solves: ['--', '--', '--', '--', '--'], best: '--' };
                                try { details = JSON.parse(entry.scramble); } catch (e) {}
                                let ao5Str = (entry.penalty === 'DNF' || entry.solve_time >= 9999) ? "DNF" : entry.solve_time.toFixed(2) + "s";

                                tr.innerHTML = `
                                    <td class="${rankClass}">${index + 1}</td>
                                    <td style="font-weight: 600;">${entry.player_name || 'Cuber'}</td>
                                    <td>${details.solves[0] || '--'}</td>
                                    <td>${details.solves[1] || '--'}</td>
                                    <td>${details.solves[2] || '--'}</td>
                                    <td>${details.solves[3] || '--'}</td>
                                    <td>${details.solves[4] || '--'}</td>
                                    <td style="color: #22c55e;">${details.best || '--'}</td>
                                    <td style="font-weight: bold; color: var(--accent-color);">${ao5Str}</td>
                                `;
                                tbody.appendChild(tr);
                            });
                        }

                        if (isSelectedToday() && user) {
                            const today = getTodayString();
                            const doneToday = dailyRows.some(row => row.user_id === user.id);
                            const btnSave = document.getElementById('btn-save');
                            if (doneToday) {
                                btnSave.disabled = true;
                                btnSave.innerText = "Đã Thi Hôm Nay";
                                document.getElementById('hint-msg').innerText = "⚠️ Bạn đã hoàn thành lượt thi Ao5 hôm nay! Hãy quay lại vào ngày mai.";
                            }
                        }
                        return;
                    }
                } catch (e) {}
            }

            let localData = JSON.parse(localStorage.getItem('rubik_hcc_leaderboard_daily')) || [];
            let filteredLocal = localData.filter(e => e.date === selectedDate);
            filteredLocal.sort((a, b) => (a.ao5 === "DNF" ? 1 : b.ao5 === "DNF" ? -1 : a.ao5 - b.ao5));

            tbody.innerHTML = '';
            if (filteredLocal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-msg">Chưa có kết quả nào trong ngày ${selectedDate}.</td></tr>`;
                document.getElementById('total-participants').innerText = '0 Thí sinh';
            } else {
                document.getElementById('total-participants').innerText = `${filteredLocal.length} Thí sinh`;
                filteredLocal.forEach((entry, index) => {
                    const tr = document.createElement('tr');
                    let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                    let ao5Str = typeof entry.ao5 === 'number' ? entry.ao5.toFixed(2) + "s" : "DNF";
                    let bestStr = entry.best === Infinity ? "DNF" : entry.best.toFixed(2);

                    tr.innerHTML = `
                        <td class="${rankClass}">${index + 1}</td>
                        <td style="font-weight: 600;">${entry.name}</td>
                        <td>${entry.solves[0]}</td>
                        <td>${entry.solves[1]}</td>
                        <td>${entry.solves[2]}</td>
                        <td>${entry.solves[3]}</td>
                        <td>${entry.solves[4]}</td>
                        <td style="color: #22c55e;">${bestStr}</td>
                        <td style="font-weight: bold; color: var(--accent-color);">${ao5Str}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        async function saveToLeaderboard() {
            if (!isSelectedToday()) {
                alert("Bạn chỉ được tham gia thi đấu trong ngày HÔM NAY! Các ngày khác chỉ được xem.");
                return;
            }

            let userName = user ? (user.user_metadata?.display_name || user.email?.split('@')[0]) : getLocalFallbackUser();
            if (!userName) {
                alert("Bạn cần đăng nhập tài khoản ở trang chính (index.html) trước khi thi!");
                return;
            }

            if (currentSolves.length < 5) {
                alert("Bạn cần hoàn thành đủ 5 lượt giải Ao5 để lưu vào Bảng Xếp Hạng!");
                return;
            }

            const today = getTodayString();
            let ao5 = calculateAo5(currentSolves);
            let bestNumeric = Math.min(...currentSolves.map(s => getNumericValue(s)));
            let solveStrings = currentSolves.map(s => formatSolve(s));

            if (client && user) {
                const rawMs = typeof ao5 === 'number' ? Math.round(ao5 * 1000) : 99999999;
                const solveTime = typeof ao5 === 'number' ? ao5 : 99999;
                const penaltyVal = ao5 === 'DNF' ? 'DNF' : 'OK';

                const scramblePayload = JSON.stringify({
                    solves: solveStrings,
                    best: bestNumeric === Infinity ? "DNF" : bestNumeric.toFixed(2)
                });

                const { error } = await client.from(TABLE).insert({
                    user_id: user.id,
                    player_name: userName,
                    scramble: scramblePayload,
                    solve_time: solveTime,
                    raw_ms: rawMs,
                    penalty: penaltyVal,
                    cube_type: '333_ao5',
                    created_at: new Date().toISOString()
                });

                if (error) {
                    alert("Lỗi lưu trực tuyến: " + error.message);
                    return;
                }
            } else {
                let localData = JSON.parse(localStorage.getItem('rubik_hcc_leaderboard_daily')) || [];
                localData.push({
                    name: userName,
                    date: today,
                    solves: solveStrings,
                    best: bestNumeric,
                    ao5: ao5
                });
                localStorage.setItem('rubik_hcc_leaderboard_daily', JSON.stringify(localData));
            }

            alert(`Đã lưu thành công kết quả Ao5 của ${userName}!`);
            document.getElementById('leaderboard-date').value = today;
            await renderLeaderboard();
            resetSession();
        }

        function resetSession() {
            currentSolves = [];
            clearInterval(inspectionInterval);
            clearInterval(timerInterval);
            timerState = 'idle';
            inspectionStart = 0;
            currentSolvePenalty = 'OK';
            document.getElementById('timer').className = 'timer-display';
            document.getElementById('timer').innerText = "0.00";
            document.getElementById('penalty-bar').style.display = 'none';
            
            updateUIForSelectedDate();
            updateSessionUI();
            generateScramble();
        }
